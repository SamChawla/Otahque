<!-- templates/base.html -->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Otahque{% endblock %}</title>
  <link rel="preload" href="{% static 'fonts/figtree-var.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{% static 'fonts/fraunces-var.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body class="min-h-screen flex flex-col bg-base-200">
  <header class="navbar bg-base-100 border-b border-base-300 h-16">
    <div class="navbar-start">
      <a href="{% url 'pages:home' %}" class="btn btn-ghost text-xl font-serif">Otahque</a>
    </div>
    <div class="navbar-end gap-1">
      <a href="{% url 'pages:home' %}" class="btn btn-ghost">Home</a>
      <a href="{% url 'events:list' %}" class="btn btn-ghost">Events</a>
      <a href="{% url 'pages:about' %}" class="btn btn-ghost">About</a>
    </div>
  </header>

  <main class="container mx-auto px-4 py-10 grow">
    {% block content %}{% endblock %}
  </main>

  <footer class="bg-base-100 border-t border-base-300 text-base-content/70 text-sm py-6">
    <div class="container mx-auto px-4 text-center">
      <p>Otahque, a gathering house for your community.</p>
    </div>
  </footer>
</body>
</html>
